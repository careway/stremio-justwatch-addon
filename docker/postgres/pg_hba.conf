# TYPE    DATABASE        USER            ADDRESS                 METHOD
# Unix socket: only reachable from inside the container (docker exec).
local     all             all                                     trust
hostssl   all             all             127.0.0.1/32            scram-sha-256
hostssl   all             all             ::1/128                 scram-sha-256

# The superuser is never allowed in from the internet: only from the
# container itself and the docker networks (omni-dev, host-side tooling).
hostssl   all             omnicatalogs    172.16.0.0/12           scram-sha-256
host      all             omnicatalogs    0.0.0.0/0               reject
host      all             omnicatalogs    ::/0                    reject

# Remote (BeamUp): only the app role, only its database, TLS + scram-sha-256.
hostssl   omnicatalogs    omnicatalogs_app 0.0.0.0/0              scram-sha-256
hostssl   omnicatalogs    omnicatalogs_app ::/0                   scram-sha-256

# Everything else (other roles/DBs, any non-TLS connection) is rejected.
host      all             all             0.0.0.0/0               reject
host      all             all             ::/0                    reject

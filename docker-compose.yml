services:
  postgres:
    build: ./docker/postgres
    container_name: omnicatalogs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnicatalogs}
      POSTGRES_USER: ${POSTGRES_USER:-omnicatalogs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      SSL_DOMAIN: ${DUCKDNS_DOMAIN}.duckdns.org
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgcerts:/var/lib/postgresql/certs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnicatalogs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  duckdns:
    image: alpine:3.20
    container_name: omnicatalogs-duckdns
    restart: unless-stopped
    environment:
      DUCKDNS_DOMAIN: ${DUCKDNS_DOMAIN:?set DUCKDNS_DOMAIN in .env}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN in .env}
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          curl -fsS "https://www.duckdns.org/update?domains=${DUCKDNS_DOMAIN}&token=${DUCKDNS_TOKEN}&ip=" -o /tmp/duck.log \
            || echo "[duckdns] update failed"
          sleep 300
        done

volumes:
  pgdata:
  pgcerts:

services:
  postgres:
    build: ./docker/postgres
    container_name: omnicatalogs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omnicatalogs}
      POSTGRES_USER: ${POSTGRES_USER:-omnicatalogs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      SSL_DOMAIN: ${DUCKDNS_DOMAIN}.duckdns.org
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgcerts:/var/lib/postgresql/certs
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnicatalogs}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgcerts:
